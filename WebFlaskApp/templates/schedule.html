<!DOCTYPE html>
<html>
<head><title>Расписание</title></head>
<body>
    <h1>Расписание</h1>
    <form method="POST">
        <input name="group_name" placeholder="Название группы" value="{{ group_name or '' }}">
        <button type="submit">Показать</button>
    </form>

    {% if entries %}
        <table border="1">
            <tr><th>Дата</th><th>Пара</th><th>Предмет</th><th>Преподаватель</th></tr>
            {% for e in entries %}
            <tr>
                <td>{{ e.date_day }}</td>
                <td>{{ e.lesson_number }}</td>
                <td>{{ e.sub_name }}</td>
                <td>{{ e.full_name }}</td>
            </tr>
            {% endfor %}
        </table>
    {% elif group_name %}
        <p>Расписание не найдено.</p>
    {% endif %}
</body>
</html>
