<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск сотрудника</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; margin-top: 1rem; background: #f9f9f9; }
        .error { color: red; margin-top: 1rem; }
        input[type="text"] { padding: 0.5rem; width: 70%; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Добро пожаловать в журнал</h1>

    <form method="POST">
        <input type="text" name="user_name" placeholder="Введите имя" required>
        <input type="text" name="user_pass" placeholder="Введите пароль" required>
        <button type="submit">Найти</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</body>
</html>
